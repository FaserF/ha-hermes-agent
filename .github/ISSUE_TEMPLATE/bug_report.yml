name: Bug Report
description: Report a bug with the Hermes Agent Home Assistant integration
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting
        - 🔍 Search [existing issues](https://github.com/FaserF/ha-hermes-agent/issues) to avoid duplicates
        - 🔗 View the integration: [![Open your Home Assistant instance and show the hermes_agent integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=hermes_agent)

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Which version of ha-hermes-agent are you running? (HACS or integration page)
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: |
        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      placeholder: e.g. 2026.10.1
    validations:
      required: true

  - type: dropdown
    id: ha_install_type
    attributes:
      label: Home Assistant Installation Type
      description: |
        Can be found in: [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true

  - type: input
    id: hermes_agent_version
    attributes:
      label: Hermes Agent Server Version
      description: Which version of Hermes Agent Gateway is running?
      placeholder: e.g. 0.22.2
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Configure integration with '...'
        2. Call service or interact with entity '...'
        3. See error / unexpected behavior
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Please provide the diagnostic data of the integration.
        Go to: **Settings -> Devices & Services -> Hermes Agent -> 3 dots menu -> Download diagnostics**.
        Sensitive values are automatically redacted.
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Enable debug logging and paste relevant log lines here.
        Add to `configuration.yaml`:
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.hermes_agent: debug
        ```
      render: shell
    validations:
      required: false
